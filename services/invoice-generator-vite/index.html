<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <title>Invoice Generator</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Montserrat", "Inter", "sans-serif"],
              serif: ['"Playfair Display"', "serif"],
              mono: ['"Space Mono"', "monospace"],
              modern: ["Montserrat", "sans-serif"],
              professional: ["Roboto", "sans-serif"],
              elegant: ["Lora", "serif"],
            },
            colors: {
              moss: {
                DEFAULT: "#14532d",
                50: "#f2fbf5",
                100: "#e1f5e8",
                200: "#c3ebd3",
                300: "#95dcb3",
                400: "#5ec58d",
                500: "#36a56e",
                600: "#268556",
                700: "#14532d",
                800: "#16543b",
                900: "#134532",
                950: "#08261c",
              },
              gold: {
                DEFAULT: "#e2b714",
                50: "#fbf9eb",
                100: "#f5f0cd",
                200: "#ebd993",
                300: "#e2b714",
                400: "#d6a110",
                500: "#b8820c",
                600: "#94600e",
                700: "#764610",
                800: "#623914",
                900: "#543015",
                950: "#301808",
              },
              ink: {
                DEFAULT: "#0b0f14",
                50: "#f4f6f7",
                100: "#e3e8eb",
                200: "#c5ced6",
                300: "#9daab6",
                400: "#738393",
                500: "#566778",
                600: "#445160",
                700: "#38414d",
                800: "#30363f",
                900: "#292d34",
                950: "#0b0f14",
              },
              porcelain: {
                DEFAULT: "#f5f7f9",
                50: "#ffffff",
                100: "#f5f7f9",
                200: "#eef1f5",
                300: "#e0e6ed",
                400: "#cdd6e1",
                500: "#94a6bc",
                600: "#788aa5",
              },
            },
            animation: {
              "fade-in": "fadeIn 0.8s ease-out forwards",
              "slide-up": "slideUp 0.8s ease-out forwards",
              float: "float 6s ease-in-out infinite",
            },
            keyframes: {
              fadeIn: {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" },
              },
              slideUp: {
                "0%": { opacity: "0", transform: "translateY(20px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
              float: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-20px)" },
              },
            },
          },
        },
      };
    </script>
    <style>
      @media print {
        @page {
          margin: 0;
        }
        body {
          margin: 0;
        }
        .no-print {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
        .print-break-inside-avoid {
          break-inside: avoid;
        }
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .glass-nav {
        background: rgba(11, 15, 20, 0.8);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .hero-gradient {
        background: radial-gradient(
          circle at 50% 0%,
          rgba(20, 83, 45, 0.15) 0%,
          rgba(11, 15, 20, 0) 70%
        );
      }

      .text-glow {
        text-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react/": "https://esm.sh/react@18.2.0/",
          "react-dom": "https://esm.sh/react-dom@18.2.0",
          "react-dom/": "https://esm.sh/react-dom@18.2.0/",
          "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
          "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react",
          "three": "https://esm.sh/three@0.160.0",
          "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.16?external=react,react-dom,three",
          "@react-three/drei": "https://esm.sh/@react-three/drei@9.99.0?external=react,react-dom,three,@react-three/fiber",
          "@react-three/rapier": "https://esm.sh/@react-three/rapier@1.3.0?external=react,react-dom,three,@react-three/fiber",
          "maath": "https://esm.sh/maath@0.10.7?external=three",
          "meshline": "https://esm.sh/meshline@3.1.6?external=three",
          "@use-gesture/react": "https://esm.sh/@use-gesture/react@10.3.0?external=react",
          "gsap": "https://esm.sh/gsap@3.12.5",
          "gsap/ScrollTrigger": "https://esm.sh/gsap@3.12.5/ScrollTrigger",
          "gsap/": "https://aistudiocdn.com/gsap@^3.13.0/",
          "react-qr-code": "https://esm.sh/react-qr-code@2.0.12?external=react,react-dom",
          "framer-motion": "https://esm.sh/framer-motion@10.16.4?external=react,react-dom"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="bg-ink text-porcelain antialiased selection:bg-moss-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
