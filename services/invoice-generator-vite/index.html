<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Mossy Roots</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
      .page-fade-out {
        opacity: 0;
        filter: blur(2px);
        pointer-events: none;
        transition: opacity 0.3s ease, filter 0.3s ease;
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Montserrat', 'Inter', 'sans-serif'],
              serif: ['"Playfair Display"', 'serif'],
              mono: ['"Space Mono"', 'monospace'],
              modern: ['Montserrat', 'sans-serif'],
              professional: ['Roboto', 'sans-serif'],
              elegant: ['Lora', 'serif'],
            },
            colors: {
              moss: {
                50: '#F4F7F4',
                100: '#E3EBE3',
                200: '#C5D6C5',
                300: '#A3BCA3',
                400: '#7A967A',
                500: '#5D7B5D',
                600: '#4A634A',
                700: '#3A4D39',
                800: '#2C3B2C',
                900: '#1A2118',
                950: '#0f140e',
              },
              cream: {
                50: '#FDFDFB',
                100: '#F9F9F7',
                200: '#F0F0EB',
                300: '#E8E8E6',
                500: '#D1D1CD',
              },
              earth: {
                500: '#8C705F',
                600: '#6B5446',
              },
              brand: {
                50: '#F4F7F4',
                100: '#E3EBE3',
                500: '#5D7B5D',
                600: '#4A634A',
                900: '#2C3B2C',
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.8s ease-out forwards',
              'slide-up': 'slideUp 0.8s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      @media print {
        @page { margin: 0; }
        body { margin: 0; }
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        .print-break-inside-avoid { break-inside: avoid; }
      }
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      
      /* Floating Lines Animation Styles */
      .floating-lines-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
      }
      .floating-lines-container canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* DomeGallery CSS */
      .sphere-root {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 600px;
        overflow: hidden;
        perspective: 2000px;
        user-select: none;
        touch-action: none;
        cursor: grab;
        background: transparent;
      }
      .sphere-root:active {
        cursor: grabbing;
      }
      
      .sphere-main {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 100%;
        transform: translate(-50%, -50%);
        transform-style: preserve-3d;
      }
      
      .stage {
        position: absolute;
        top: 50%;
        left: 50%;
        transform-style: preserve-3d;
      }
      
      .sphere {
        position: relative;
        transform-style: preserve-3d;
        width: 0;
        height: 0;
      }
      
      .item {
        position: absolute;
        top: 0;
        left: 0;
        width: 100px;
        height: 100px;
        --unit: calc(360deg / var(--segments-x) / 2);
        transform: 
          rotateY(calc(var(--unit) * (var(--offset-x) + (var(--item-size-x) - 1) / 2)))
          rotateX(calc(var(--unit) * (var(--offset-y) + (var(--item-size-y) - 1) / 2)))
          translateZ(var(--radius));
        transform-style: preserve-3d;
        backface-visibility: hidden;
      }
      
      .item__image {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 150px;
        height: 200px;
        transform: translate(-50%, -50%);
        border-radius: var(--tile-radius);
        overflow: hidden;
        background: #1a1a1a;
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), filter 0.3s, box-shadow 0.3s;
        filter: var(--image-filter);
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        border: 1px solid rgba(255,255,255,0.1);
      }
      
      .item__image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
        display: block;
      }
      
      .item__image:hover {
        transform: translate(-50%, -50%) scale(1.05);
        filter: none;
        z-index: 10;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        border-color: rgba(255,255,255,0.3);
      }

      .item__image--reference {
        opacity: 0;
      }
      
      .viewer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 100;
      }
      
      .scrim {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.85);
        backdrop-filter: blur(5px);
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: auto;
        display: none;
      }
      
      [data-enlarging="true"] .scrim {
        display: block;
        opacity: 1;
      }
      
      .frame {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 85vw;
        height: 85vh;
        pointer-events: none;
      }
      
      .enlarge {
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        border-radius: var(--enlarge-radius, 30px);
      }
      .enlarge img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      
      .dg-scroll-lock {
        overflow: hidden;
      }

      /* Overlay Styles - Added for proper rendering */
      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 5;
      }
      .overlay--blur {
        backdrop-filter: blur(0px);
      }
      
      .edge-fade {
        position: absolute;
        left: 0;
        right: 0;
        height: 120px;
        z-index: 20;
        pointer-events: none;
      }
      .edge-fade--top {
        top: 0;
        background: linear-gradient(to bottom, var(--overlay-blur-color), transparent);
      }
      .edge-fade--bottom {
        bottom: 0;
        background: linear-gradient(to top, var(--overlay-blur-color), transparent);
      }

      /* Scroll Reveal Styles */
      .scroll-reveal .word {
        display: inline-block;
        white-space: pre-wrap;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react",
    "three": "https://esm.sh/three@0.160.0",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.16?external=react,react-dom,three",
    "@react-three/drei": "https://esm.sh/@react-three/drei@9.99.0?external=react,react-dom,three,@react-three/fiber",
    "@react-three/rapier": "https://esm.sh/@react-three/rapier@1.3.0?external=react,react-dom,three,@react-three/fiber",
    "maath": "https://esm.sh/maath@0.10.7?external=three",
    "meshline": "https://esm.sh/meshline@3.1.6?external=three",
    "@use-gesture/react": "https://esm.sh/@use-gesture/react@10.3.0?external=react",
    "gsap": "https://esm.sh/gsap@3.12.5",
    "gsap/ScrollTrigger": "https://esm.sh/gsap@3.12.5/ScrollTrigger",
    "gsap/": "https://aistudiocdn.com/gsap@^3.13.0/"
  }
}
</script>
</head>
  <body class="bg-cream-100 text-moss-900 dark:bg-moss-950 dark:text-cream-100 antialiased selection:bg-moss-200 selection:text-moss-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
