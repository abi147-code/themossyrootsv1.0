# Docker Compose configuration for the TMR CRM stack.
# NOTE: n8n now publishes on 5680 externally (mapped to container port 5678)
# to avoid collisions with local tooling that also uses 5678. Access it at
# http://localhost:5680.

services:
  proxy:
    container_name: tmr-proxy
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - web
      - api
      - invoice-api
      - n8n
    networks:
      - tmr-network

  web:
    container_name: tmr-web
    build:
      context: ./services/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_INVOICE_API_URL: http://localhost:5000
    environment:
      - NEXT_PUBLIC_APP_NAME=TMR CRM
      - NEXT_PUBLIC_TRIAL_DAYS=${TRIAL_DAYS}
      - NEXT_PUBLIC_INVOICE_API_URL=http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - api
      - invoice-api
    restart: unless-stopped
    networks:
      - tmr-network

  api:
    container_name: tmr-api
    build:
      context: ./services/api
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - TRIAL_DAYS=${TRIAL_DAYS}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - MAILPIT_HOST=mailpit
      - MAILPIT_PORT=1025
      - INVOICE_API_URL=${INVOICE_API_URL:-http://invoice-api:5000}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/social-snippet}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME}
      - ADMIN_ORG_NAME=${ADMIN_ORG_NAME}
    depends_on:
      - db
      - mailpit
      - invoice-api
    ports:
      - "5555:5555"
    volumes:
      - ./services/api/uploads:/app/uploads
    restart: unless-stopped
    networks:
      - tmr-network

  db:
    container_name: tmr-db
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - tmr-network

  mailpit:
    container_name: tmr-mailpit
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - tmr-network

  invoice-api:
    container_name: tmr-invoice-api
    build:
      context: ./services/invoice-api
      dockerfile: Dockerfile
    volumes:
      - ./services/invoice-api:/app:rw
    command: gunicorn -b 0.0.0.0:5000 app:app
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - tmr-network

  n8n:
    container_name: tmr-n8n
    build:
      context: ./services/n8n
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_PORT=5678
    # External port switched to 5680 to avoid local conflicts.
    ports:
      - "5680:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - tmr-network

volumes:
  db-data:
  n8n-data:

networks:
  tmr-network:
    driver: bridge



