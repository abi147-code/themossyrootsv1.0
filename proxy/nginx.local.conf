upstream web {
    server tmr-web:3000;
}

upstream api {
    server tmr-api:4000;
}

upstream invoice_api {
    server tmr-invoice-api:5000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Serve static invoice-generator assets built locally
    location /invoice-generator/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /invoice-generator/index.html;
    }

    # File uploads served from API container
    location ^~ /uploads/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default web frontend
    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API routes point to local api container
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_pass http://api;
    }

    location = /uploads {
        return 301 /uploads/;
    }

    # Temp assets served by API
    location /temp-assets/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api/temp-assets/;
    }

    # Invoice API routes to local invoice service
    location /invoice/ {
        proxy_pass http://invoice_api;
        proxy_set_header Host $host;
    }
}
